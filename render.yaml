# Render Deployment Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: helper-fullstack-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: fastapi_db
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "120"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
