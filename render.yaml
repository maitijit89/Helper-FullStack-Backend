# Render Deployment Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: helper-fullstack-backend
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: helper_production
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "120"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
