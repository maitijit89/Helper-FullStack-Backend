[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-production-base"
version = "0.1.0"
description = "Production Ready Python + FastAPI Backend Base"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["app", "api"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
