version: '3.8'

services:
  main-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helping_services_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - PROJECT_NAME=Helping Services
      - VERSION=1.2.1
      - API_V1_STR=/api/v1
      - JWT_SECRET=helping-services-jwt-super-secret-key-2026
      - JWT_EXPIRES_IN=7d
      - OTP_EXPIRES_IN_MINUTES=10
      - REGISTRATION_REMINDER_DAYS=3
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=helping_services_db
      - MONGODB_CORE_DB_NAME=helping_services_core
      - MONGODB_CATALOG_DB_NAME=helping_services_catalog
      - MONGODB_ANALYTICS_DB_NAME=helping_services_analytics
      - REDIS_URL=redis://redis:6379
      - ANALYSIS_ENGINE_SECRET=helping-services-analysis-engine-secret-2026
      - ADMIN_SUB_BACKEND_SECRET=helping-services-admin-sub-backend-secret-2026
      - ADMIN_SUB_BACKEND_URL=http://admin-sub-backend:8001
      - CART_DWELL_BOOST_MINUTES=15
      - RATE_LIMIT_PER_MINUTE=300
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - helping_services_net

  mongodb:
    image: mongo:7.0
    container_name: helping_services_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helping_services_net

  redis:
    image: redis:7.2-alpine
    container_name: helping_services_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helping_services_net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  helping_services_net:
    driver: bridge
