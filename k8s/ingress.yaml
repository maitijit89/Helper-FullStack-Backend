apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helping-services-ingress
  namespace: helping-services
  labels:
    app.kubernetes.io/name: main-backend
    app.kubernetes.io/part-of: helping-services
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.helpingservices.com
      secretName: helping-services-tls-cert
  rules:
    - host: api.helpingservices.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helping-services-main-backend-svc
                port:
                  number: 8000

