apiVersion: apps/v1
kind: Deployment
metadata:
  name: helping-services-main-backend
  namespace: helping-services
  labels:
    app.kubernetes.io/name: main-backend
    app.kubernetes.io/part-of: helping-services
    app.kubernetes.io/version: "1.2.1"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: main-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: main-backend
        app.kubernetes.io/part-of: helping-services
        app.kubernetes.io/version: "1.2.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/health"
        prometheus.io/port: "8000"
    spec:
      # Pod Anti-Affinity: Spread pods across distinct cluster nodes for fault tolerance
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - main-backend
                topologyKey: "kubernetes.io/hostname"
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: main-backend
          image: helping-services/main-backend:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: helping-services-config
            - secretRef:
                name: helping-services-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # Startup probe allows initial DB connection pool establishment
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 2
          # Liveness probe monitors application deadlock / failure
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe ensures traffic is only routed to ready pods
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

