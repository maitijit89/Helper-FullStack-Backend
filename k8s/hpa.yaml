apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helping-services-main-backend-hpa
  namespace: helping-services
  labels:
    app.kubernetes.io/name: main-backend
    app.kubernetes.io/part-of: helping-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helping-services-main-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Min

