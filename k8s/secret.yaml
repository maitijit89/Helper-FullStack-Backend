apiVersion: v1
kind: Secret
metadata:
  name: helping-services-secrets
  namespace: helping-services
  labels:
    app.kubernetes.io/name: main-backend
    app.kubernetes.io/part-of: helping-services
type: Opaque
stringData:
  # JWT Secret Key
  JWT_SECRET: "helping-services-jwt-super-secret-key-production-2026"
  JWT_EXPIRES_IN: "7d"

  # MongoDB Connection String (Atlas or Internal Cluster)
  MONGODB_URL: "mongodb+srv://app_user:StrongPassword2026@cluster0.mongodb.net/?retryWrites=true&w=majority"

  # Upstash Redis / Distributed Cache URL
  REDIS_URL: "rediss://default:YourRedisToken@your-redis-instance.upstash.io:6379"
  UPSTASH_REDIS_REST_URL: ""
  UPSTASH_REDIS_REST_TOKEN: ""

  # Sub-Backend Secrets
  ANALYSIS_ENGINE_SECRET: "helping-services-analysis-engine-secret-2026"
  ADMIN_SUB_BACKEND_SECRET: "helping-services-admin-sub-backend-secret-2026"

  # Cloudflare R2 Object Storage Credentials
  CLOUDFLARE_R2_ACCOUNT_ID: "your-cloudflare-account-id"
  CLOUDFLARE_R2_ACCESS_KEY_ID: "your-r2-access-key-id"
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: "your-r2-secret-access-key"
  CLOUDFLARE_R2_BUCKET_NAME: "helping-services-uploads"
  CLOUDFLARE_R2_PUBLIC_URL: "https://cdn.helpingservices.com"
  CLOUDFLARE_R2_ENDPOINT: ""

  # SMTP Credentials (optional, emails log to console if blank)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@helpingservices.com"
  SMTP_PASS: "your-smtp-app-password"
  SMTP_FROM: "Helping Services <noreply@helpingservices.com>"
  SMTP_SECURE: "false"

