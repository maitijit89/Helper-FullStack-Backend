apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helping-services

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: helping-services
      app.kubernetes.io/managed-by: kustomize

